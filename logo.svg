<svg viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .walmack-text { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 32px; font-weight: 600; letter-spacing: 2px; }
    </style>
  </defs>
  
  <!-- Логотип - левая часть -->
  <g transform="translate(10, 15)">
    <!-- Внешний круг -->
    <circle cx="35" cy="35" r="32" fill="none" stroke="#0066B2" stroke-width="1.5" opacity="0.2"/>
    
    <!-- Синяя волна слева -->
    <path d="M 15 35 Q 12 20, 25 15 Q 30 12, 32 20 Q 33 28, 32 35 Q 31 45, 25 50 Q 12 58, 15 45" fill="#0066B2" opacity="0.9"/>
    
    <!-- Синяя дополнительная волна -->
    <path d="M 18 32 Q 16 25, 22 20 Q 26 18, 28 23 Q 29 28, 28 32 Q 27 40, 22 42 Q 16 44, 18 38" fill="#0066B2" opacity="0.7"/>
    
    <!-- Оранжевый круг сверху -->
    <circle cx="45" cy="18" r="12" fill="#E8A722"/>
    
    <!-- Оранжевая волна справа снизу -->
    <path d="M 48 50 Q 52 48, 58 50 Q 62 52, 60 58 Q 56 62, 50 60 Q 45 58, 48 54" fill="#E8A722" opacity="0.85"/>
    
    <!-- Синяя дугa справа -->
    <path d="M 50 25 Q 62 28, 63 38 Q 62 48, 50 50" fill="none" stroke="#0066B2" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Центральный круг -->
    <circle cx="35" cy="35" r="18" fill="none" stroke="#0066B2" stroke-width="1.5" opacity="0.4"/>
  </g>
  
  <!-- Текст WALMACK -->
  <text x="80" y="55" class="walmack-text" fill="#0066B2">WALMACK</text>
</svg>